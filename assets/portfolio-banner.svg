    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#64FFBD" stroke-opacity=".09" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
